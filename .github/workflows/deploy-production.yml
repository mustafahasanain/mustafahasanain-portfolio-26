name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy exact commit
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repository quality gates
        run: npm run verify

      - name: Prepare SSH credentials
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "${VPS_SSH_PRIVATE_KEY}" || -z "${VPS_KNOWN_HOSTS}" ]]; then
            echo "Required SSH configuration is missing." >&2
            exit 1
          fi

          install -m 700 -d "${HOME}/.ssh"
          install -m 600 /dev/null "${RUNNER_TEMP}/portfolio_deploy_key"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" | tr -d '\r' > "${RUNNER_TEMP}/portfolio_deploy_key"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy triggering commit
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The triggering commit is not a 40-character lowercase SHA." >&2
            exit 1
          fi

          if [[ -z "${VPS_HOST}" ]]; then
            echo "The VPS_HOST secret is missing." >&2
            exit 1
          fi

          ssh \
            -i "${RUNNER_TEMP}/portfolio_deploy_key" \
            -p 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "portfolio-deploy@${VPS_HOST}" \
            "sudo /usr/local/sbin/deploy-mustafahasanain-portfolio '${DEPLOY_SHA}'"

      - name: Remove SSH private key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/portfolio_deploy_key"
